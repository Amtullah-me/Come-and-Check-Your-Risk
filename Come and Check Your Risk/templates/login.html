  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

 <script src="{{ url_for('static', filename='script.js') }}" defer></script>
  <style>
  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 40px;
    background: rgba(10,22,40,0.7);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--glass-border);
    position: sticky; top:0; z-index: 100;
  }
  .logo-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    cursor: pointer;
  }
  .logo-img-ring {
    position: relative;
    width: 52px;
    height: 52px;
    flex-shrink: 0;
  }
  .logo-img-ring::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #00c9a7, #818cf8, #f472b6, #00c9a7);
    animation: logoRingSpin 4s linear infinite;
    z-index: 0;
  }
  .logo-img-ring::after {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #00c9a7, #818cf8, #f472b6, #00c9a7);
    animation: logoRingSpin 4s linear infinite;
    filter: blur(6px);
    opacity: 0.6;
    z-index: 0;
  }
  .logo-img-ring img {
    position: relative;
    z-index: 1;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
  }
  @keyframes logoRingSpin { to { transform: rotate(360deg); } }
  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 1.6rem; font-weight: 800;
    background: linear-gradient(135deg, var(--teal), var(--lavender));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
  }
  .logo span { font-weight: 400; }
  .nav-links { display:flex; gap:24px; align-items:center; }
  .nav-links a {
    color: var(--text-muted); text-decoration: none; font-size:0.9rem;
    transition: color var(--transition);
  }
  .nav-links a:hover { color: var(--teal); }
</style>
</head>

    <div class="glass-card" id="loginCard">

        <h1 class="card-title">Welcome Back</h1>
        <p class="card-subtitle">Sign in to your OncoGen Care account</p>

      <form id="loginForm" novalidate>
        <!-- Email -->
        <div class="form-group">
          <label for="loginEmail">Email or Username</label>
          <div class="input-wrap">
            <span class="icon">✉️</span>
            <input type="text" id="loginEmail" class="glass-input" placeholder="you@example.com">
          </div>
          <div class="error-msg" id="loginEmailError">Enter a valid email or username</div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <div class="input-wrap">
            <span class="icon">🔒</span>
            <input type="password" id="loginPassword" class="glass-input has-toggle" placeholder="••••••••">
            <button type="button" class="toggle-pw" onclick="togglePassword('loginPassword', this)">👁️</button>
          </div>
          <div class="error-msg" id="loginPasswordError">Password must be at least 8 characters</div>
        </div>

        <div class="form-group">

        <div class="checkbox-row">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe"> Remember me
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-submit">
          <span>🔑</span> Sign In
